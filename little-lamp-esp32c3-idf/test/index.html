<!doctype html>
<html>

<head>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <meta http-equiv="x-ua-compatible" content="IE=edge" />
    <title>Little Lamp</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none;
        }

        div.head {
            background-color: #333;
            color: #fff;
            font-size: 2em;
            padding: 0.5em;
        }

        div.panel div.title {
            border-top: 1px dotted #fff;
            background-color: #666;
            color: #fff;
            padding-left: 10px;
        }

        div.panel div.content {
            /* display: none; */
            padding: 1em;
        }

        div.panel div.content span.label {
            display: inline-block;
            width: 5em;
        }

        div.panel div.content select {
            width: 10em;
        }

        div.panel div.content input {
            width: 10em;
        }

        div.panel div.content div.content-line {
            padding: 1em;
        }

        div.panel div.content div.content-line span.label {
            line-height: 2em;
            width: 3em;
            position: relative;
            top: -0.8em;
        }

        .slider {
            display: inline-block;
            width: 14em;
            height: 2em;
            border-radius: 0.5em;
            border: 0.05em solid #ccc;
        }

        .slider-control {
            position: relative;
            top: -0.4em;
            width: 1.2em;
            height: 2.8em;
            background: #fff;
            border-radius: 0.2em;
            border: 0.05em solid #ccc;
        }

        .slider-color-warm {
            background: linear-gradient(270deg, orange, white);
        }

        .slider-color-color {
            background: linear-gradient(to left, violet, red, orange, yellow, green, blue, indigo, violet);
        }

        .slider-color-brightness {
            background: linear-gradient(270deg, white, gray);
        }

        .mulit-sel .mulit-sel-item {
            display: inline-block;
            width: 5em;
            height: 2em;
            border-radius: 0.5em;
            border: 0.05em solid #ccc;
            margin-right: 0.8em;
            text-align: center;
            line-height: 2em;
        }

        .mulit-sel .mulit-sel-item.selected {
            background-color: orange;
            color: white;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function (event) {
            const modes = {
                normal: { code: 'normal', val: 0 },
                sleep: { code: 'sleep', val: 1 },
                color: { code: 'color', val: 2 }
            }

            var tagMap = {
                warm: 0,
                color: 0,
                brightness: 0
            }

            var mode = modes.normal.code

            const nvl = (data, replace) => {
                return data ? data : replace ? replace : '--'
            }

            var baseHost = document.location.origin
            // const brightnessAButton = document.getElementById('btn-brightness-a')
            // const iptBrightnessA = document.getElementById('ipt-brightness-a')
            // const brightnessBButton = document.getElementById('btn-brightness-b')
            // const iptBrightnessB = document.getElementById('ipt-brightness-b')

            const getInfo = (callback) => {
                console.log(`get info...`)
                const query = `${baseHost}/info`
                fetch(query).then(response => response.json())
                    .then(data => {
                        console.log(data)
                        callback(data)
                    })
                    .catch(error => console.error("Error:", error))
            }

            const sendCmd = (code, value) => {
                console.log(`send cmd: ${code}=${value}`)
                const query = `${baseHost}/control?var=${code}&val=${value}`
                fetch(query).then(response => {
                    console.log(`request to ${query} finished, status: ${response.status}`)
                })
            }

            const refreshMode = () => {
                var modeEles = document.getElementsByClassName('mulit-sel-item')
                for (var i = 0; i < modeEles.length; i++) {
                    var element = modeEles[i]
                    tag = element.attributes['tag'].value
                    if (mode == tag) {
                        element.classList.add('selected')
                    } else {
                        element.classList.remove('selected')
                    }
                }
                document.getElementById('content-line-warm').classList.remove('hidden')
                document.getElementById('content-line-color').classList.remove('hidden')
                document.getElementById('content-line-brightness').classList.remove('hidden')
                if (modes.color.code == mode) {
                    document.getElementById('content-line-warm').classList.add('hidden')
                    return
                }
                document.getElementById('content-line-color').classList.add('hidden')
            }

            const refreshSlider = () => {
                var eles = document.getElementsByClassName('slider-control')
                for (var i = 0; i < eles.length; i++) {
                    var element = eles[i]
                    tag = element.attributes['tag'].value
                    var w = element.parentNode.clientWidth - element.clientWidth
                    var x = (w * tagMap[tag] / 100).toFixed()
                    element.attributes['ex-last'] = x
                    element.style.left = x + 'px'
                }
            }

            const refreshUI = () => {
                getInfo((data) => {
                    for (var attr in modes) {
                        var m = modes[attr]
                        if (m.val = data.mode) {
                            mode = m.code
                        }
                    }
                    brightness = 0
                    warm = 0
                    color = 0
                    if (modes.normal.code == mode) {
                        if (data.brightnessA > data.brightnessB) {
                            brightness = data.brightnessA
                            warm = (data.brightnessB / data.brightnessA * 100).toFixed()
                        } else {
                            brightness = data.brightnessB
                            warm = (data.brightnessA / data.brightnessB * 100).toFixed()
                        }
                    }
                    if (modes.color.code == mode) {
                        color = data.color
                        brightness = data.brightness
                    }
                    if (modes.sleep.code == mode) {
                        brightness = data.brightness
                        warm = data.warm
                    }
                    tagMap.color = color
                    tagMap.brightness = brightness
                    tagMap.warm = warm
                    refreshMode()
                    refreshSlider()
                })
            }

            const modeChange = (m) => {
                mode = m
                refreshMode()
            }

            const lightChange = () => {
                if (modes.normal.code == mode) {
                    var brightnessA = 0 // white
                    var brightnessB = 0 // orange
                    if (tagMap.warm > 50) {
                        // orange is higher
                        brightnessB = tagMap.brightness
                        brightnessA = brightnessB * (1 - tagMap.warm / 100)
                    } else {
                        // white is higher
                        brightnessA = tagMap.brightness
                        brightnessB = brightnessA * (tagMap.warm / 100)
                    }
                    //sendCmd("set-brightness-a", brightnessA.toFixed())
                    //sendCmd("set-brightness-b", brightnessB.toFixed())
                    sendCmd("set-cmd", [mode, brightnessA.toFixed(), brightnessB.toFixed()].join(','))
                }

                if (modes.color.code == mode) {
                    var brightnessA = tagMap.color // color
                    var brightnessB = tagMap.brightness // brightness
                    sendCmd("set-cmd", [mode, brightnessA.toFixed(), brightnessB.toFixed()].join(','))
                }

                if (modes.sleep.code == mode) {
                    var brightnessA = tagMap.warm // warm
                    var brightnessB = tagMap.brightness // brightness
                    sendCmd("set-cmd", [mode, brightnessA.toFixed(), brightnessB.toFixed()].join(','))
                }
            }

            const sliderChange = (tag, value) => {
                tagMap[tag] = value
                //console.log('warm: ' + tagMap.warm + ', brightness: ' + tagMap.brightness)
                lightChange()
            }

            var eles = document.getElementsByClassName('slider-control')
            for (var i = 0; i < eles.length; i++) {
                var element = eles[i]
                element.addEventListener('touchstart', e => {
                    var touch = e.touches ? e.touches[0] : e
                    e.target.attributes['ex-offset'] = touch.clientX
                })
                element.addEventListener('touchmove', e => {
                    var touch = e.touches ? e.touches[0] : e
                    var w = e.target.parentNode.clientWidth - e.target.clientWidth
                    var startX = e.target.attributes['ex-last'] || 0
                    var x = (startX + touch.clientX - e.target.attributes['ex-offset'])
                    if (x < 0) {
                        x = 0
                    }
                    if (x > w) {
                        x = w
                    }
                    e.target.style.left = x + 'px'
                    e.target.attributes['ex-current'] = x
                })
                element.addEventListener('touchend', e => {
                    var w = e.target.parentNode.clientWidth - e.target.clientWidth
                    var x = e.target.attributes['ex-current']
                    e.target.attributes['ex-last'] = x
                    var value = Math.round(x / w * 100)
                    //console.log('value: ' + value)
                    sliderChange(e.target.attributes['tag'].value, value)
                })
            }

            var modeEles = document.getElementsByClassName('mulit-sel-item')
            for (var i = 0; i < modeEles.length; i++) {
                var element = modeEles[i]
                element.addEventListener('touchend', e => {
                    var items = e.target.parentNode.getElementsByClassName('mulit-sel-item')
                    for (var i = 0, len = items.length; i < len; i++) {
                        items[i].classList.remove('selected')
                    }
                    e.target.classList.add('selected')
                    modeChange(e.target.attributes['tag'].value)
                    lightChange()
                })
            }

            refreshUI()

            // brightnessAButton.addEventListener('click', ()=> sendCmd("set-brightness-a", iptBrightnessA.value))
            // brightnessBButton.addEventListener('click', ()=> sendCmd("set-brightness-b", iptBrightnessB.value))
        })
    </script>
</head>

<body οncοntextmenu="return false" onselectstart="return false" οndragstart="return false" οncοpy="return false"
    oncut="return false;">
    <div>
        <div class="head">Little Lamp</div>
        <div class="panel" id="pnl-control">
            <div class="title">控制面板</div>
            <div class="content">
                <div class="content-line">
                    <span class="label">模式</span>
                    <div class="mulit-sel">
                        <div class="mulit-sel-item" tag="sleep">睡眠</div>
                        <div class="mulit-sel-item selected" tag="normal">普通</div>
                        <div class="mulit-sel-item" tag="color">炫彩</div>
                    </div>
                </div>
                <!-- <p><span class="label">显示亮度A</span><input type="text" value="50" id="ipt-brightness-a"/>&nbsp;<button id="btn-brightness-a">更改</button></p>
                <p><span class="label">显示亮度B</span><input type="text" value="50" id="ipt-brightness-b"/>&nbsp;<button id="btn-brightness-b">更改</button></p> -->
                <div id="content-line-warm" class="content-line">
                    <span class="label">色温</span>
                    <div class="slider slider-color-warm">
                        <div class="slider-control" tag="warm"></div>
                    </div>
                </div>
                <div id="content-line-color" class="content-line hidden">
                    <span class="label">色相</span>
                    <div class="slider slider-color-color">
                        <div class="slider-control" tag="color"></div>
                    </div>
                </div>
                <div id="content-line-brightness" class="content-line">
                    <span class="label">亮度</span>
                    <div class="slider slider-color-brightness">
                        <div class="slider-control" tag="brightness"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
